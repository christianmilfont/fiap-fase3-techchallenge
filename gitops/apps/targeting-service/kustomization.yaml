apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: targeting-service

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: targeting-service
      app.kubernetes.io/part-of: togglemaster
      app.kubernetes.io/managed-by: argocd

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Atualizado automaticamente pelo job update-gitops do CI:
#   kustomize edit set image togglemaster/targeting-service=<registry>/togglemaster/targeting-service:<tag>
images:
  - name: togglemaster/targeting-service
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/togglemaster/targeting-service
    newTag: latest
