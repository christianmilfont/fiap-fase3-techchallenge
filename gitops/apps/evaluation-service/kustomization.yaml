apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evaluation-service

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: evaluation-service
      app.kubernetes.io/part-of: togglemaster
      app.kubernetes.io/managed-by: argocd

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - serviceaccount.yaml
  - hpa.yaml

# Atualizado automaticamente pelo job update-gitops do CI:
#   kustomize edit set image togglemaster/evaluation-service=<registry>/togglemaster/evaluation-service:<tag>
images:
  - name: togglemaster/evaluation-service
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/togglemaster/evaluation-service
    newTag: latest
